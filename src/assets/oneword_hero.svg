<svg width="700" height="500" viewBox="0 0 700 500" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="baseGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F2896B"/>
      <stop offset="100%" stop-color="#E86B49"/>
    </linearGradient>
    <linearGradient id="baseTopGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FBAE94"/>
      <stop offset="100%" stop-color="#F2896B"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8A488"/>
      <stop offset="100%" stop-color="#EE7C58"/>
    </linearGradient>
    <linearGradient id="squareGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5987A"/>
      <stop offset="100%" stop-color="#E9714F"/>
    </linearGradient>
    <linearGradient id="squareTopGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FBC1AC"/>
      <stop offset="100%" stop-color="#F5987A"/>
    </linearGradient>
    <radialGradient id="shadowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C96B4E" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#C96B4E" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- soft floor shadow -->
  <ellipse cx="350" cy="400" rx="220" ry="34" fill="url(#shadowGrad)"/>

  <!-- fanned pages behind base -->
  <g>
    <rect x="215" y="230" width="70" height="110" rx="10" fill="url(#cardGrad)" transform="rotate(-18 250 285)"/>
    <rect x="228" y="220" width="70" height="110" rx="10" fill="url(#cardGrad)" transform="rotate(-9 263 275)"/>
    <rect x="240" y="212" width="70" height="112" rx="10" fill="url(#cardGrad)" transform="rotate(0 275 268)"/>
  </g>

  <!-- long rounded base -->
  <path d="M180 350
           q0 -30 30 -30
           h300
           q30 0 30 30
           v10
           q0 30 -30 30
           h-300
           q-30 0 -30 -30
           z"
        fill="url(#baseGrad)"/>
  <path d="M180 350
           q0 -30 30 -30
           h300
           q30 0 30 30
           q0 18 -30 18
           h-300
           q-30 0 -30 -18
           z"
        fill="url(#baseTopGrad)"/>

  <!-- upright square with chat-tag cutout -->
  <g>
    <rect x="360" y="150" width="130" height="150" rx="26" fill="url(#squareGrad)"/>
    <rect x="360" y="150" width="130" height="34" rx="17" fill="url(#squareTopGrad)"/>

    <!-- chat bubble / tag cutout -->
    <path d="M400 195
             h50
             a14 14 0 0 1 14 14
             v34
             a14 14 0 0 1 -14 14
             h-24
             l-14 16
             v-16
             h-12
             a14 14 0 0 1 -14 -14
             v-34
             a14 14 0 0 1 14 -14
             z"
          fill="#FFFFFF" fill-opacity="0.95"/>
  </g>
</svg>
